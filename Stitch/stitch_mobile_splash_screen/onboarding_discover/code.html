<!DOCTYPE html>

<html class="dark" lang="en"><head>

<script id="tailwind-config">

</div>
</div>

<h1 class="text-3xl font-bold tracking-tight text-slate-100 mb-4">
                        Discover Unique <span class="text-primary">Vendors</span>
</h1>
<p class="text-slate-300 text-lg leading-relaxed">
                        Connect with creators and explorers in our curated digital marketplace. Your journey starts here.
                    </p>
</div>
</div>

<div class="flex items-center justify-center gap-3">

<div class="h-2 w-2 rounded-full bg-white/20"></div>
<div class="h-2 w-2 rounded-full bg-white/20"></div>
</div>
</div>

<div class="mt-auto py-8">
<button class="w-full flex items-center justify-center gap-2 overflow-hidden rounded-full h-16 bg-primary text-white text-lg font-bold tracking-wide shadow-lg shadow-primary/20 hover:scale-[1.02] transition-transform">

<span class="material-symbols-outlined text-2xl">arrow_forward</span>
