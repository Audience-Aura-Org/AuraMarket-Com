<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aura Market - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#120812",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "poppins": ["Poppins", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-morphism {
            background: rgba(242, 13, 242, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .liquid-card {
            background: linear-gradient(135deg, rgba(242, 13, 242, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
            box-shadow: 0 8px 32px 0 rgba(242, 13, 242, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-poppins text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto overflow-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-6 justify-between z-10">
<button aria-label="Go back" class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full bg-primary/10">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 px-4">
<div class="h-1.5 w-full bg-primary/10 rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 rounded-full"></div>
</div>
</div>
<button class="text-primary font-semibold text-sm">Skip</button>
</div>
<!-- Main Content Hero Section -->
<div class="flex flex-col grow px-6 pt-4 pb-12 items-center justify-center text-center">
<!-- Glass Digital Wallet Illustration -->
<div class="relative w-full aspect-square flex items-center justify-center mb-12">
<!-- Background decorative glow -->
<div class="absolute w-64 h-64 bg-primary/30 rounded-full blur-3xl"></div>
<!-- The Liquid Glass Card -->
<div class="liquid-card relative w-72 h-44 rounded-2xl flex flex-col p-6 text-left overflow-hidden border border-white/20">
<div class="flex justify-between items-start">
<div class="size-10 bg-white/20 rounded-lg backdrop-blur-md flex items-center justify-center">
<span class="material-symbols-outlined text-white">contactless</span>
</div>
<div class="text-white/80 font-display font-bold text-lg italic">AURA</div>
</div>
<div class="mt-auto">
<div class="text-white/60 text-xs mb-1 uppercase tracking-widest">Balance</div>
<div class="text-white text-2xl font-bold font-display leading-tight">$12,450.00</div>
</div>
<!-- Liquid effect overlay -->
<div class="absolute -right-4 -bottom-4 size-32 bg-primary/40 rounded-full blur-2xl"></div>
</div>
<!-- Floating elements for depth -->
<div class="absolute top-1/4 right-8 glass-morphism size-16 rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary scale-125">payments</span>
</div>
<div class="absolute bottom-1/4 left-8 glass-morphism size-12 rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-sm">lock</span>
</div>
</div>
<!-- Typography Content -->
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold leading-tight mb-4 px-2">
                Seamless Wallet &amp; <span class="text-primary">Payments</span>
</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed px-4">
                Experience the future of digital finance with our liquid glass interface. Secure, fast, and effortless transactions.
            </p>
<!-- Pagination Dots -->
<div class="flex flex-row items-center justify-center gap-2 mt-8 mb-4">
<div class="h-1.5 w-1.5 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-4 rounded-full bg-primary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/20"></div>
</div>
</div>
<!-- Footer Action -->
<div class="p-6 pb-12">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 group">
                Next Step
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</body></html>
