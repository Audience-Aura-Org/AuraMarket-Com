<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#120812",
                    },
                    fontFamily: {
                        "display": ["Poppins", "Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .liquid-glass {
            background: rgba(242, 13, 242, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(242, 13, 242, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .liquid-glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="relative flex h-auto min-h-screen w-full max-w-md flex-col bg-background-light dark:bg-background-dark overflow-x-hidden pb-24">
<!-- Top App Bar -->
<div class="flex items-center p-6 pb-2 justify-between sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-lg">
<div class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full bg-slate-200 dark:bg-white/10 cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-semibold leading-tight tracking-tight flex-1 text-center pr-10">Checkout</h2>
</div>
<!-- Progress Stepper -->
<div class="px-6 py-4 flex items-center justify-between">
<div class="flex flex-col items-center gap-1">
<div class="size-8 rounded-full bg-primary flex items-center justify-center text-white text-xs font-bold">1</div>
<span class="text-[10px] uppercase tracking-wider text-primary font-bold">Cart</span>
</div>
<div class="h-[2px] flex-1 bg-primary/30 mx-2 mb-4"></div>
<div class="flex flex-col items-center gap-1">
<div class="size-8 rounded-full bg-primary flex items-center justify-center text-white text-xs font-bold ring-4 ring-primary/20">2</div>
<span class="text-[10px] uppercase tracking-wider text-primary font-bold">Details</span>
</div>
<div class="h-[2px] flex-1 bg-slate-700 mx-2 mb-4"></div>
<div class="flex flex-col items-center gap-1">
<div class="size-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 text-xs font-bold">3</div>
<span class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Confirm</span>
</div>
</div>
<!-- Delivery Section -->
<div class="px-6 pt-4">
<div class="flex justify-between items-center mb-4">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-semibold tracking-tight">Delivery Address</h3>
<button class="text-primary text-sm font-medium">Add New</button>
</div>
<div class="liquid-glass-card rounded-xl p-4 flex items-start gap-4 border-primary/20 bg-primary/5">
<div class="text-primary flex items-center justify-center rounded-full bg-primary/10 shrink-0 size-12">
<span class="material-symbols-outlined">location_on</span>
</div>
<div class="flex flex-col justify-center flex-1">
<div class="flex justify-between items-start">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold leading-normal">Home Office</p>
<span class="text-[10px] bg-primary/20 text-primary px-2 py-0.5 rounded-full font-bold uppercase">Default</span>
</div>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-relaxed mt-1">123 Neon Circuit, Cyber District<br/>Neo City, NC 54321</p>
</div>
<button class="text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
</div>
<!-- Payment Methods -->
<div class="px-6 pt-8">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-semibold tracking-tight mb-4">Payment Method</h3>
<div class="flex flex-col gap-3">
<label class="liquid-glass-card flex items-center gap-4 rounded-xl p-4 cursor-pointer border-transparent hover:border-primary/30 transition-all group">
<input checked="" class="h-5 w-5 border-2 border-slate-600 bg-transparent text-primary focus:ring-primary checked:bg-primary" name="payment" type="radio"/>
<div class="flex grow flex-col">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">account_balance_wallet</span>
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Aura Wallet</p>
</div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-normal">Balance: $1,250.00</p>
</div>
</label>
<label class="liquid-glass-card flex items-center gap-4 rounded-xl p-4 cursor-pointer border-transparent hover:border-primary/30 transition-all">
<input class="h-5 w-5 border-2 border-slate-600 bg-transparent text-primary focus:ring-primary checked:bg-primary" name="payment" type="radio"/>
<div class="flex grow flex-col">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400 text-xl">gavel</span>
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Escrow Service</p>
</div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-normal">Secure third-party hold</p>
</div>
</label>
<label class="liquid-glass-card flex items-center gap-4 rounded-xl p-4 cursor-pointer border-transparent hover:border-primary/30 transition-all">
<input class="h-5 w-5 border-2 border-slate-600 bg-transparent text-primary focus:ring-primary checked:bg-primary" name="payment" type="radio"/>
<div class="flex grow flex-col">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400 text-xl">payments</span>
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Direct Transfer</p>
</div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-normal">Bank to bank (0.5% fee)</p>
</div>
</label>
</div>
</div>
<!-- Order Summary -->
<div class="px-6 pt-8">
<div class="liquid-glass rounded-2xl p-6">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-semibold tracking-tight mb-4">Order Summary</h3>
<div class="space-y-3">
<div class="flex justify-between text-sm">
<span class="text-slate-500 dark:text-slate-400">Subtotal</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">$840.00</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-slate-500 dark:text-slate-400">Shipping</span>
<span class="text-emerald-500 font-medium">Free</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-slate-500 dark:text-slate-400">Platform Fee</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">$12.50</span>
</div>
<div class="h-px bg-slate-200 dark:bg-slate-800 my-2"></div>
<div class="flex justify-between text-lg">
<span class="text-slate-900 dark:text-slate-100 font-bold">Total</span>
<span class="text-primary font-bold">$852.50</span>
</div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-6 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>Place Order</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-[10px] text-slate-500 mt-3 font-medium uppercase tracking-widest">Secure 256-bit encrypted checkout</p>
</div>

</div>
</div>
