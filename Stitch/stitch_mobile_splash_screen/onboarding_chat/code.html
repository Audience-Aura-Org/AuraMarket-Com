<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#f20df2",
                "background-light": "#f8f5f8",
                "background-dark": "#120812",
              },
              fontFamily: {
                "display": ["Poppins", "Plus Jakarta Sans", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(242, 13, 242, 0.2);
        }
        .vibrant-glow {
            background: radial-gradient(circle at 50% 50%, #f20df2 0%, #7e0c7e 50%, #120812 100%);
            opacity: 0.4;
            filter: blur(60px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar Space -->
<div class="flex items-center p-6 justify-between z-10">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-sm font-medium opacity-60">Step 3 of 3</div>
<div class="w-12"></div> <!-- Spacer for symmetry -->
</div>
<!-- Hero Illustration Section -->
<div class="flex-1 flex flex-col items-center justify-center px-6 relative">
<!-- Background Decorative Glows -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 vibrant-glow rounded-full -z-10"></div>
<div class="w-full max-w-sm aspect-square relative flex items-center justify-center">
<!-- Liquid Glass Chat Bubble -->
<div class="w-64 h-64 liquid-glass rounded-full flex items-center justify-center relative overflow-hidden">
<!-- Subtle inner glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-transparent"></div>
<!-- Floating Product Icons -->
<div class="grid grid-cols-2 gap-6 z-10">
<div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20 shadow-lg">
<span class="material-symbols-outlined text-3xl text-primary">shopping_bag</span>
</div>
<div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20 shadow-lg mt-4">
<span class="material-symbols-outlined text-3xl text-primary">payments</span>
</div>
<div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20 shadow-lg -mt-2">
<span class="material-symbols-outlined text-3xl text-primary">local_shipping</span>
</div>
<div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20 shadow-lg mt-2">
<span class="material-symbols-outlined text-3xl text-primary">chat</span>
</div>
</div>
</div>
<!-- Floating Accessory Chat Tail -->
<div class="absolute bottom-10 right-20 w-12 h-12 liquid-glass rounded-full -rotate-45 -z-10"></div>
</div>
</div>
<!-- Text Content Section -->
<div class="px-8 pb-10 flex flex-col items-center text-center">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[36px] font-bold leading-tight pb-3">
                Chat to Buy
            </h1>
<p class="text-slate-600 dark:text-slate-300 text-lg font-normal leading-relaxed max-w-xs">
                Experience a new way of shopping. Message sellers directly and close deals in real-time.
            </p>
<!-- Pagination Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-10">
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
</div>
<!-- Action Button -->
<div class="w-full max-w-md">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-5 px-8 rounded-xl text-lg transition-all shadow-xl shadow-primary/20 flex items-center justify-center gap-2">
                    Get Started
                    <span class="material-symbols-outlined">rocket_launch</span>
</button>
</div>
</div>
<!-- Bottom Spacer for Home Indicator -->
<div class="h-8"></div>
</div>
<!-- Background Layer for "Liquid Glass" feel -->
<div class="fixed inset-0 pointer-events-none -z-20 bg-background-light dark:bg-background-dark overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
</div>
</body></html>
