<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#180818",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(242, 13, 242, 0.4);
        }
        .bg-gradient-mesh {
            background-color: #180818;
            background-image: 
                radial-gradient(at 0% 0%, rgba(242, 13, 242, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(242, 13, 242, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(79, 70, 229, 0.15) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen relative overflow-x-hidden">
<div class="fixed inset-0 bg-gradient-mesh -z-10" data-alt="Vibrant blurred purple and pink mesh gradient"></div>
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px] -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600/20 rounded-full blur-[120px] -z-10"></div>
<div class="relative flex flex-col min-h-screen">
<header class="flex items-center justify-between px-6 lg:px-12 py-6">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(242,13,242,0.4)]">
<span class="material-symbols-outlined text-white text-2xl">auto_awesome</span>
</div>
<h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-white/60">
                    Aura Market
                </h1>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium text-slate-400 hover:text-primary transition-colors" href="#">Marketplace</a>
<a class="text-sm font-medium text-slate-400 hover:text-primary transition-colors" href="#">Explore</a>
<a class="text-sm font-medium text-slate-400 hover:text-primary transition-colors" href="#">Help</a>
</nav>
<button class="px-6 py-2 rounded-full border border-white/10 hover:border-primary/50 text-sm font-semibold transition-all">
                Sign Up
            </button>
</header>
<main class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-[480px]">
<div class="glass-panel rounded-xl p-8 md:p-12 shadow-2xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
<div class="mb-10 text-center">
<h2 class="text-3xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400">Welcome Back</h2>
<p class="text-slate-400 font-medium">Enter your credentials to access your Aura account</p>
</div>
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-300 ml-1">Email or Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">mail</span>
<input class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-4 text-white focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all outline-none placeholder:text-slate-600" placeholder="e.g. name@email.com" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-semibold text-slate-300">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">lock</span>
<input class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-12 text-white focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all outline-none placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-[0_0_25px_rgba(242,13,242,0.3)] transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                            Sign In
                        </button>
</form>
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-[#231223] text-slate-500 font-medium">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="glass-button flex items-center justify-center gap-3 py-3 rounded-xl text-sm font-semibold text-slate-200">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
                            Google
                        </button>
<button class="glass-button flex items-center justify-center gap-3 py-3 rounded-xl text-sm font-semibold text-slate-200">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.72-3.41 1.72-1.33 0-1.74-.83-3.29-.83-1.56 0-2.01.81-3.3.81-1.28 0-2.45-.82-3.41-1.72-2.02-2.02-3.07-5.07-3.07-8.13 0-3.08 1.06-6.14 3.07-8.14 1.1-.96 2.37-1.55 3.64-1.55 1.25 0 2.05.51 3.25.51 1.17 0 1.95-.51 3.25-.51 1.28 0 2.54.6 3.64 1.55 2.02 2 3.07 5.06 3.07 8.14 0 3.06-1.05 6.11-3.07 8.13l-.15.15zM12.03 7.25c0-1.92 1.55-3.47 3.47-3.47.05 0 .1 0 .15.01-.15-2.33-2.12-4.14-4.47-4.14-2.42 0-4.38 1.96-4.38 4.38 0 2.33 1.81 4.29 4.14 4.47-.01-.05-.01-.1-.01-.15 0-.37.31-.68.68-.68.15 0 .28.05.39.12.01.09.02.18.02.26z" fill="currentColor"></path>
</svg>
                            Apple
                        </button>
</div>
<div class="mt-10 text-center">
<p class="text-sm text-slate-400">
                            New to Aura? <a class="text-primary font-bold hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
<footer class="mt-8 flex justify-center gap-6 text-xs text-slate-500 font-medium">
<a class="hover:text-slate-300 transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-slate-300 transition-colors" href="#">Terms of Service</a>
<a class="hover:text-slate-300 transition-colors" href="#">Contact Us</a>
</footer>
</div>
</main>
</div>
</body></html>
